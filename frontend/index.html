<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>🎵 YouTube Music Downloader</h1>
        <p>Pesquise músicas, adicione links ou playlists, revise a fila e acompanhe o download em tempo real.</p>
    </header>

    <section class="search-box">
        <div class="field">
            <label for="artist">Música, artista ou banda</label>
            <input id="artist" type="text" placeholder="Ex: Linkin Park - Numb">
        </div>
        <div class="field quantity">
            <label for="quantity">Resultados</label>
            <input id="quantity" type="number" min="1" max="50" value="10">
        </div>
        <button id="searchButton">🔎 Buscar no YouTube</button>
    </section>

    <section class="import-box">
        <div class="section-title">
            <h2>🔗 Links e playlists</h2>
            <span>Um ou vários links, um por linha</span>
        </div>
        <textarea id="linksInput" rows="4" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/playlist?list=..."></textarea>
        <div class="import-actions">
            <button id="importButton">➕ Adicionar links</button>
            <label class="file-button">
                📄 Adicionar TXT
                <input id="txtFile" type="file" accept=".txt,text/plain">
            </label>
        </div>
    </section>

    <section class="folder-box">
        <div>
            <h2>📁 Pasta de download</h2>
            <div id="folderPath">Carregando...</div>
        </div>
        <div class="folder-actions">
            <button id="selectFolderButton">Escolher pasta</button>
            <button id="resetFolderButton" class="secondary">Pasta padrão</button>
        </div>
    </section>

    <section class="results">
        <div class="results-header">
            <div>
                <h2>Fila de músicas</h2>
                <span id="queueCount">0 músicas</span>
            </div>
            <button id="clearButton" class="danger">🗑 Limpar lista</button>
        </div>
        <div id="loading" class="hidden">🔎 Procurando músicas...</div>
        <div id="songList"></div>
        <div id="searchResults" class="search-results hidden"></div>
    </section>

    <section class="download-section">
        <button id="downloadButton" class="download">⬇️ Baixar selecionadas</button>
        <div id="progressPanel" class="progress-panel hidden">
            <div class="progress-summary" id="progressSummary"></div>
            <div class="progress-bar"><div id="overallProgress" class="progress-fill"></div></div>
            <div id="currentSong" class="current-song"></div>
        </div>
        <div id="status"></div>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>
